<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Cici 💗</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e7, #ffb4d2, #ffcce3);
    color: #7b3152;
}

/* Dekorasi background */
.bg {
    position: fixed;
    pointer-events: none;
    animation: melayang 4s ease-in-out infinite;
    opacity: .7;
}

.bg1 { top: 8%; left: 8%; font-size: 28px; }
.bg2 { top: 18%; right: 10%; font-size: 22px; animation-delay: 1s; }
.bg3 { bottom: 15%; left: 7%; font-size: 25px; animation-delay: 2s; }
.bg4 { bottom: 10%; right: 8%; font-size: 30px; animation-delay: 1.5s; }
.bg5 { top: 50%; right: 5%; font-size: 18px; animation-delay: 3s; }

@keyframes melayang {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-15px) rotate(8deg);
    }
}

/* Halaman */
.page {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: all .7s ease;
}

.hidden {
    opacity: 0;
    transform: scale(.8);
    pointer-events: none;
}

/* Card */
.card {
    width: 100%;
    max-width: 440px;
    padding: 30px 25px;
    text-align: center;
    background: rgba(255,255,255,.88);
    border: 3px solid rgba(255,255,255,.7);
    border-radius: 30px;
    box-shadow: 0 15px 50px rgba(180,50,100,.25);
    backdrop-filter: blur(12px);
}

.emoji {
    font-size: 65px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

h1 {
    color: #e83e82;
    font-size: 30px;
    margin: 12px 0;
}

.subtitle {
    color: #9a5270;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ff9bc2;
    border-radius: 50px;
    outline: none;
    text-align: center;
    font-size: 16px;
    color: #d23876;
    background: #fff8fb;
    margin: 12px 0;
}

input:focus {
    border-color: #ed4c91;
    box-shadow: 0 0 15px rgba(237,76,145,.2);
}

button {
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff4d98, #e9367c);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(220,50,120,.3);
    transition: .25s;
}

button:hover {
    transform: scale(1.06);
}

button:active {
    transform: scale(.95);
}

#error {
    min-height: 22px;
    margin-top: 12px;
    color: #df3d72;
    font-size: 13px;
}

/* Halaman pesan */
.message-card {
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
}

.message-card::-webkit-scrollbar {
    width: 4px;
}

.message-card::-webkit-scrollbar-thumb {
    background: #ff9fc4;
    border-radius: 10px;
}

.title {
    color: #e83d82;
    font-size: 32px;
    font-weight: bold;
    margin-top: 10px;
}

.message {
    text-align: left;
    margin-top: 20px;
    line-height: 1.8;
    font-size: 15px;
    color: #71334f;
    white-space: pre-line;
    min-height: 250px;
}

/* Stiker kucing */
.cat-sticker {
    margin-top: 15px;
    display: flex;
    justify-content: center;
}

.cat {
    font-size: 75px;
    display: inline-block;
    animation: catBounce 1.8s infinite;
    filter: drop-shadow(0 5px 5px rgba(150,50,90,.15));
}

@keyframes catBounce {
    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }
    50% {
        transform: translateY(-10px) rotate(3deg);
    }
}

.cat-text {
    margin-top: -5px;
    color: #e83d82;
    font-weight: bold;
    font-size: 14px;
}

/* Hati terbang */
.heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: naik 5s linear forwards;
}

@keyframes naik {
    0% {
        transform: translateY(0) scale(.8) rotate(0);
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) scale(1.5) rotate(30deg);
        opacity: 0;
    }
}

/* Mobile */
@media(max-width:480px) {
    .card {
        padding: 25px 20px;
    }

    .message {
        font-size: 14px;
    }

    .title {
        font-size: 29px;
    }

    .emoji {
        font-size: 58px;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="bg bg1">💗</div>
<div class="bg bg2">💕</div>
<div class="bg bg3">🌸</div>
<div class="bg bg4">💖</div>
<div class="bg bg5">✨</div>


<!-- =========================
     HALAMAN PASSWORD
========================= -->

<section id="loginPage" class="page">

    <div class="card">

        <div class="emoji">🐰💗</div>

        <h1>Hai Cici 🌷</h1>

        <p class="subtitle">
            Sebelum masuk, masukin kata sandi rahasia
            dulu yaa 🤭
        </p>

        <p style="font-size:14px;">
            🔐 Kata sandinya tanggal lahir Cici
        </p>

        <input
            type="password"
            id="password"
            maxlength="8"
            placeholder="Masukkan kata sandi..."
        >

        <br>

        <button onclick="checkPassword()">
            Masuk 💕
        </button>

        <div id="error"></div>

        <p style="
            margin-top:15px;
            font-size:12px;
            color:#b77b96;
        ">
            petunjuk: DDMMYYYY 🤭
        </p>

    </div>

</section>


<!-- =========================
     HALAMAN PESAN
========================= -->

<section id="messagePage" class="page hidden">

    <div class="card message-card">

        <div class="emoji">🥺🌷</div>

        <div class="title">
            Hai Cici 💗
        </div>

        <div id="message" class="message"></div>

        <!-- STIKER KUCING -->
        <div class="cat-sticker">
            <div>
                <div class="cat">🐱🎀</div>

                <div class="cat-text">
                    jangan lupa senyum ya Cici 💗
                </div>
            </div>
        </div>

        <button
            onclick="hearts()"
            style="margin-top:20px;"
        >
            Pencet kalau Cici senyum 😭💗
        </button>

    </div>

</section>


<script>

/* =========================
   PASSWORD
========================= */

const passwordBenar = "04092009";

function checkPassword() {

    const input = document.getElementById("password");
    const error = document.getElementById("error");

    if (input.value === passwordBenar) {

        error.innerHTML = "Benarrr 🥳💗";

        setTimeout(function() {

            document.getElementById("loginPage")
                .classList.add("hidden");

            setTimeout(function() {

                document.getElementById("messagePage")
                    .classList.remove("hidden");

                mulaiMengetik();
                hearts();

            }, 500);

        }, 700);

    } else {

        error.innerHTML =
            "Hehe salah 😭 coba inget-inget lagi Cici 🤭💗";

        input.value = "";

        input.animate(
            [
                { transform: "translateX(0)" },
                { transform: "translateX(-8px)" },
                { transform: "translateX(8px)" },
                { transform: "translateX(-8px)" },
                { transform: "translateX(0)" }
            ],
            {
                duration: 350
            }
        );
    }
}


/* =========================
   PESAN
========================= */

const teks = `Cici cuma mau bilang, semoga hari Cici selalu bahagia yaa 🥺💗

Kalau ada apa-apa, cerita aja.
Always jadi pendengar yang baik kok aku ni 😭💗

Semoga pas abis lebaran sempat ketemu ya Cii 🥺

Pengen rasanya ngabisin waktu,
biarpun cuma sehari same Cici.

Yang penting bisa ketemu,
bisa ngobrol,
bisa ketawa bareng,
dan bisa lihat Cici senyum secara langsung hehe 🌷

Semoga Cici selalu dikasih kebahagiaan,
dimudahkan dalam segala hal,
dan dikelilingi orang-orang yang sayang sama Cici.

Kalau lagi bad mood juga nggak apa-apa,
namanya juga Cici suka berubah mood kan 😭😂

Pokoknya jangan terlalu keras sama diri sendiri yaa.

Dan satu lagi...

Aku suka lihat Cici tersenyum 🥺💗

Jadi semoga lebih banyak hari
yang bikin Cici tersenyum yaa 🌸✨`;


/* =========================
   EFEK MENGETIK
========================= */

function mulaiMengetik() {

    const element = document.getElementById("message");

    let i = 0;

    element.innerHTML = "";

    function ketik() {

        if (i < teks.length) {

            element.innerHTML += teks.charAt(i);

            i++;

            setTimeout(ketik, 25);

        }

    }

    ketik();
}


/* =========================
   HATI TERBANG
========================= */

function hearts() {

    const emoji = [
        "💗",
        "💕",
        "💖",
        "💓",
        "🌸",
        "✨",
        "🎀"
    ];

    for(let i = 0; i < 18; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            emoji[Math.floor(Math.random() * emoji.length)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            (15 + Math.random() * 22) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }
}


/* ENTER UNTUK LOGIN */

document.getElementById("password")
.addEventListener("keydown", function(e) {

    if(e.key === "Enter") {
        checkPassword();
    }

});

</script>

</body>
</html>
